<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#141414;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGradM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="heroM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#141414" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="posterM1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#7f1d1d"/></linearGradient>
    <linearGradient id="posterM2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#78350f"/></linearGradient>
    <linearGradient id="posterM3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="posterM4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#064e3b"/></linearGradient>
    <linearGradient id="posterM5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#312e81"/></linearGradient>
    <linearGradient id="posterM6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e11d48"/><stop offset="100%" stop-color="#881337"/></linearGradient>
    <filter id="mShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    </defs>
  <rect width="390" height="844" rx="40" fill="url(#bgGradM)"/>

  <!-- Top Inline 16:9 Player View (0 to 220px) -->
  <g id="MobileInlinePlayer">
    <rect x="0" y="0" width="390" height="230" fill="url(#posterM1)"/>
    <circle cx="195" cy="115" r="70" fill="#000000" fill-opacity="0.3"/>
    
    <!-- Player Touch HUD Overlay -->
    <rect x="0" y="0" width="390" height="230" fill="#000000" fill-opacity="0.4"/>
    
    <!-- Top HUD: Back Button & Title -->
    <g transform="translate(16, 50)">
      <text x="0" y="16" fill="#FFFFFF" font-size="18" font-weight="bold">←</text>
      <text x="28" y="15" fill="#FFFFFF" font-size="13" font-weight="bold">Deadpool &amp; Wolverine</text>
      <!-- PiP Icon -->
      <g transform="translate(300, 2)">
        <rect x="0" y="0" width="16" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
        <rect x="6" y="4" width="8" height="6" rx="1" fill="#FFFFFF"/>
      </g>
      <!-- Cast -->
      <g transform="translate(330, 2)">
        <rect x="0" y="0" width="16" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="2" cy="10" r="1.5" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Center Play/Pause Touch Target -->
    <g transform="translate(195, 120)">
      <circle cx="0" cy="0" r="24" fill="#000000" fill-opacity="0.6" stroke="#FFFFFF" stroke-width="1.5"/>
      <rect x="-6" y="-10" width="4" height="20" rx="1" fill="#FFFFFF"/>
      <rect x="2" y="-10" width="4" height="20" rx="1" fill="#FFFFFF"/>
    </g>

    <!-- Bottom Scrubber & Time -->
    <g transform="translate(16, 210)">
      <text x="0" y="10" fill="#FFFFFF" font-size="10">24:15</text>
      <rect x="36" y="5" width="280" height="4" rx="2" fill="#555555"/>
      <rect x="36" y="5" width="90" height="4" rx="2" fill="#E50914"/>
      <circle cx="126" cy="7" r="5" fill="#FFFFFF"/>
      <text x="325" y="10" fill="#AAAAAA" font-size="10">2:07:45</text>
    </g>
  </g>

  <!-- Content Below Player (Portrait Scrollable Content) -->
  <g transform="translate(16, 246)">
    <text x="0" y="24" fill="#FFFFFF" font-size="20" font-weight="900">Deadpool &amp; Wolverine</text>
    
    <!-- Meta badges -->
    <g transform="translate(0, 36)">
      <text x="0" y="12" fill="#FFD700" font-size="12" font-weight="bold">★ 8.2 (142k)</text>
      <text x="75" y="12" fill="#AAAAAA" font-size="12">2024</text>
      <rect x="110" y="0" width="30" height="16" rx="3" fill="#252525"/>
      <text x="125" y="12" fill="#CCCCCC" font-size="9" font-weight="bold" text-anchor="middle">17+</text>
      <text x="150" y="12" fill="#AAAAAA" font-size="12">2j 07m</text>
      <rect x="195" y="0" width="48" height="16" rx="3" fill="#E50914"/>
      <text x="219" y="12" fill="#FFFFFF" font-size="9" font-weight="bold" text-anchor="middle">FULL HD</text>
    </g>

    <!-- Primary Action Button: Full-width Red Button -->
    <g transform="translate(0, 64)">
      <rect x="0" y="0" width="358" height="42" rx="8" fill="#E50914"/>
      <polygon points="135,14 135,28 147,21" fill="#FFFFFF"/>
      <text x="155" y="26" fill="#FFFFFF" font-size="14" font-weight="bold">Lanjutkan Menonton</text>
    </g>

    <!-- Action Icons Row: Daftar, Unduh, Bagikan -->
    <g transform="translate(0, 118)">
      <!-- Add to list -->
      <g transform="translate(40, 0)">
        <circle cx="15" cy="15" r="15" fill="#252525"/>
        <text x="15" y="20" fill="#FFFFFF" font-size="15" text-anchor="middle">+</text>
        <text x="15" y="42" fill="#AAAAAA" font-size="10" text-anchor="middle">Daftar Saya</text>
      </g>
      <!-- Subtitle -->
      <g transform="translate(145, 0)">
        <circle cx="15" cy="15" r="15" fill="#252525"/>
        <text x="15" y="20" fill="#FFD700" font-size="11" font-weight="bold" text-anchor="middle">CC</text>
        <text x="15" y="42" fill="#FFD700" font-size="10" text-anchor="middle">SubDL (ID)</text>
      </g>
      <!-- Download -->
      <g transform="translate(250, 0)">
        <circle cx="15" cy="15" r="15" fill="#252525"/>
        <text x="15" y="20" fill="#FFFFFF" font-size="13" text-anchor="middle">↓</text>
        <text x="15" y="42" fill="#AAAAAA" font-size="10" text-anchor="middle">Unduh</text>
      </g>
    </g>

    <!-- Synopsis -->
    <g transform="translate(0, 175)">
      <text x="0" y="14" fill="#CCCCCC" font-size="12">
        Wade Wilson menjalani hidup biasa setelah pensiun sebagai
      </text>
      <text x="0" y="30" fill="#CCCCCC" font-size="12">
        Deadpool, hingga TVA merekrutnya untuk misi penyelamatan
      </text>
      <text x="0" y="46" fill="#CCCCCC" font-size="12">
        alam semestanya bersama Wolverine yang enggan bekerja sama.
      </text>
      <text x="0" y="68" fill="#888888" font-size="11">Pemeran: Ryan Reynolds, Hugh Jackman, Emma Corrin</text>
    </g>

    <!-- Tabs: Rekomendasi Serupa -->
    <g transform="translate(0, 260)">
      <text x="0" y="18" fill="#E50914" font-size="13" font-weight="bold">Film Terkait &amp; Rekomendasi</text>
      <rect x="0" y="26" width="160" height="2" fill="#E50914"/>

      <!-- 3 Small Recommended Posters -->
      <g transform="translate(0, 40)">
        <rect x="0" y="0" width="112" height="150" rx="8" fill="url(#posterM4)"/>
        <text x="6" y="140" fill="#FFFFFF" font-size="10" font-weight="bold">Deadpool 2</text>

        <rect x="123" y="0" width="112" height="150" rx="8" fill="url(#posterM3)"/>
        <text x="129" y="140" fill="#FFFFFF" font-size="10" font-weight="bold">Logan (2017)</text>

        <rect x="246" y="0" width="112" height="150" rx="8" fill="url(#posterM2)"/>
        <text x="252" y="140" fill="#FFFFFF" font-size="10" font-weight="bold">Free Guy</text>
      </g>
    </g>
  </g>

  
    <!-- Status Bar (09:41, Icons, Battery) -->
    <g id="StatusBar" transform="translate(0, 0)">
      <rect width="390" height="44" fill="#000000" fill-opacity="0.3"/>
      <!-- Time -->
      <text x="32" y="28" fill="#FFFFFF" font-size="14" font-weight="600">09:41</text>
      <!-- Dynamic Island / Notch Pill -->
      <rect x="140" y="8" width="110" height="24" rx="12" fill="#000000"/>
      <!-- Icons Right -->
      <g transform="translate(315, 17)">
        <!-- Signal -->
        <rect x="0" y="8" width="3" height="4" fill="#FFFFFF"/>
        <rect x="4" y="6" width="3" height="6" fill="#FFFFFF"/>
        <rect x="8" y="3" width="3" height="9" fill="#FFFFFF"/>
        <rect x="12" y="0" width="3" height="12" fill="#FFFFFF"/>
        <!-- 5G / WiFi -->
        <text x="20" y="10" fill="#FFFFFF" font-size="10" font-weight="bold">5G</text>
        <!-- Battery -->
        <rect x="40" y="1" width="20" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
        <rect x="42" y="3" width="14" height="6" rx="1.5" fill="#FFFFFF"/>
      </g>
    </g>
    
</svg>