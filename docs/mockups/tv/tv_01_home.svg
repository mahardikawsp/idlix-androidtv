<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#141414;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141414" stop-opacity="0.98"/>
      <stop offset="40%" stop-color="#141414" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#141414" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="heroBottomGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414" stop-opacity="0"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#b81d24"/>
    </linearGradient>
    <linearGradient id="posterGrad1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#451a03"/></linearGradient>
    <linearGradient id="posterGrad2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="posterGrad3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#581c87"/></linearGradient>
    <linearGradient id="posterGrad4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#064e3b"/></linearGradient>
    <linearGradient id="posterGrad5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#312e81"/></linearGradient>
    <linearGradient id="posterGrad6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e11d48"/><stop offset="100%" stop-color="#881337"/></linearGradient>
    <filter id="focusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    </defs>
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Content Container (offset by drawer 64px) -->
  <g transform="translate(64, 0)">
    
    <!-- Hero Billboard Backdrop -->
    <rect x="0" y="0" width="1216" height="380" fill="url(#posterGrad1)"/>
    <circle cx="850" cy="140" r="130" fill="#f59e0b" fill-opacity="0.25"/>
    <rect x="0" y="0" width="1216" height="380" fill="url(#heroGradient)"/>
    <rect x="0" y="160" width="1216" height="220" fill="url(#heroBottomGrad)"/>

    <!-- Hero Content -->
    <g transform="translate(48, 50)">
      <rect x="0" y="0" width="96" height="22" rx="4" fill="#E50914"/>
      <text x="48" y="15" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">BOX OFFICE</text>

      <text x="0" y="68" fill="#FFFFFF" font-size="44" font-weight="900" letter-spacing="0.5">DUNE: PART TWO</text>

      <!-- Metadata Badges -->
      <g transform="translate(0, 84)">
        <rect x="0" y="0" width="38" height="18" rx="3" fill="#2A2A2A"/>
        <text x="19" y="13" fill="#FFD700" font-size="11" font-weight="bold" text-anchor="middle">★ 8.6</text>
        
        <text x="50" y="14" fill="#AAAAAA" font-size="12">2024</text>
        <circle cx="90" cy="10" r="2" fill="#555555"/>
        <text x="100" y="14" fill="#AAAAAA" font-size="12">2j 46m</text>
        <circle cx="150" cy="10" r="2" fill="#555555"/>
        <rect x="160" y="0" width="46" height="18" rx="3" stroke="#555555" fill="none"/>
        <text x="183" y="13" fill="#CCCCCC" font-size="10" font-weight="bold" text-anchor="middle">4K UHD</text>
        <text x="218" y="14" fill="#AAAAAA" font-size="12">Aksi • Petualangan • Sci-Fi</text>
      </g>

      <text x="0" y="132" fill="#CCCCCC" font-size="13" width="560" font-weight="normal">
        Paul Atreides bersatu dengan Chani dan suku Fremen sambil membalas dendam terhadap para konspirator
      </text>
      <text x="0" y="150" fill="#CCCCCC" font-size="13" width="560" font-weight="normal">
        yang menghancurkan keluarganya di planet gurun pasir Arrakis.
      </text>

      <!-- Action Buttons -->
      <g transform="translate(0, 180)">
        <!-- Play Button (Focused) -->
        <g filter="url(#focusGlow)">
          <rect x="0" y="0" width="140" height="42" rx="8" fill="#E50914"/>
          <polygon points="24,14 24,28 36,21" fill="#FFFFFF"/>
          <text x="46" y="26" fill="#FFFFFF" font-size="14" font-weight="bold">Putar Film</text>
        </g>
        <!-- Detail Button -->
        <g transform="translate(156, 0)">
          <rect x="0" y="0" width="130" height="42" rx="8" fill="#2A2A2A" stroke="#444444"/>
          <circle cx="26" cy="21" r="9" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
          <text x="26" y="24" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">i</text>
          <text x="44" y="26" fill="#FFFFFF" font-size="14" font-weight="500">Detail Info</text>
        </g>
      </g>
    </g>

    <!-- Continue Watching Row (Swimlane) -->
    <g transform="translate(48, 350)">
      <text x="0" y="0" fill="#FFFFFF" font-size="16" font-weight="bold">Lanjutkan Menonton</text>
      <text x="170" y="0" fill="#E50914" font-size="12" font-weight="bold">LIHAT SEMUA →</text>
      
      <!-- Cards (16:9 thumbnail format) -->
      <g transform="translate(0, 16)">
        <!-- Card 1 -->
        <g>
          <rect x="0" y="0" width="220" height="124" rx="8" fill="url(#posterGrad6)" filter="url(#cardShadow)"/>
          <rect x="0" y="90" width="220" height="34" rx="0" fill="#141414" fill-opacity="0.85"/>
          <text x="10" y="106" fill="#FFFFFF" font-size="11" font-weight="bold">Deadpool &amp; Wolverine</text>
          <text x="10" y="118" fill="#AAAAAA" font-size="9">Film • Sisa 45m</text>
          <circle cx="110" cy="50" r="18" fill="#000000" fill-opacity="0.6"/>
          <polygon points="106,44 106,56 116,50" fill="#FFFFFF"/>
          <!-- Progress Bar -->
          <rect x="0" y="121" width="220" height="3" fill="#333333"/>
          <rect x="0" y="121" width="140" height="3" fill="#E50914"/>
        </g>

        <!-- Card 2 -->
        <g transform="translate(236, 0)">
          <rect x="0" y="0" width="220" height="124" rx="8" fill="url(#posterGrad4)" filter="url(#cardShadow)"/>
          <rect x="0" y="90" width="220" height="34" fill="#141414" fill-opacity="0.85"/>
          <text x="10" y="106" fill="#FFFFFF" font-size="11" font-weight="bold">Loki: Season 2</text>
          <text x="10" y="118" fill="#AAAAAA" font-size="9">Eps 4 • Sisa 18m</text>
          <circle cx="110" cy="50" r="18" fill="#000000" fill-opacity="0.6"/>
          <polygon points="106,44 106,56 116,50" fill="#FFFFFF"/>
          <rect x="0" y="121" width="220" height="3" fill="#333333"/>
          <rect x="0" y="121" width="165" height="3" fill="#E50914"/>
        </g>

        <!-- Card 3 -->
        <g transform="translate(472, 0)">
          <rect x="0" y="0" width="220" height="124" rx="8" fill="url(#posterGrad5)" filter="url(#cardShadow)"/>
          <rect x="0" y="90" width="220" height="34" fill="#141414" fill-opacity="0.85"/>
          <text x="10" y="106" fill="#FFFFFF" font-size="11" font-weight="bold">Shōgun: Season 1</text>
          <text x="10" y="118" fill="#AAAAAA" font-size="9">Eps 3 • Sisa 35m</text>
          <circle cx="110" cy="50" r="18" fill="#000000" fill-opacity="0.6"/>
          <polygon points="106,44 106,56 116,50" fill="#FFFFFF"/>
          <rect x="0" y="121" width="220" height="3" fill="#333333"/>
          <rect x="0" y="121" width="70" height="3" fill="#E50914"/>
        </g>

        <!-- Card 4 -->
        <g transform="translate(708, 0)">
          <rect x="0" y="0" width="220" height="124" rx="8" fill="url(#posterGrad2)" filter="url(#cardShadow)"/>
          <rect x="0" y="90" width="220" height="34" fill="#141414" fill-opacity="0.85"/>
          <text x="10" y="106" fill="#FFFFFF" font-size="11" font-weight="bold">Fallout: Season 1</text>
          <text x="10" y="118" fill="#AAAAAA" font-size="9">Eps 1 • Sisa 25m</text>
          <circle cx="110" cy="50" r="18" fill="#000000" fill-opacity="0.6"/>
          <polygon points="106,44 106,56 116,50" fill="#FFFFFF"/>
          <rect x="0" y="121" width="220" height="3" fill="#333333"/>
          <rect x="0" y="121" width="180" height="3" fill="#E50914"/>
        </g>

        <!-- Card 5 (Peeking) -->
        <g transform="translate(944, 0)">
          <rect x="0" y="0" width="220" height="124" rx="8" fill="url(#posterGrad3)"/>
        </g>
      </g>
    </g>

    <!-- Trending Movies Swimlane (2:3 aspect) -->
    <g transform="translate(48, 520)">
      <text x="0" y="0" fill="#FFFFFF" font-size="16" font-weight="bold">Film Sedang Tren di IDLIX</text>
      
      <g transform="translate(0, 16)">
        <!-- Poster 1 -->
        <g>
          <rect x="0" y="0" width="136" height="150" rx="6" fill="url(#posterGrad3)" filter="url(#cardShadow)"/>
          <rect x="6" y="6" width="36" height="16" rx="3" fill="#000000" fill-opacity="0.75"/>
          <text x="24" y="18" fill="#FFD700" font-size="9" font-weight="bold" text-anchor="middle">★ 8.9</text>
          <text x="6" y="140" fill="#FFFFFF" font-size="11" font-weight="bold">Oppenheimer</text>
        </g>

        <!-- Poster 2 -->
        <g transform="translate(150, 0)">
          <rect x="0" y="0" width="136" height="150" rx="6" fill="url(#posterGrad2)" filter="url(#cardShadow)"/>
          <rect x="6" y="6" width="36" height="16" rx="3" fill="#000000" fill-opacity="0.75"/>
          <text x="24" y="18" fill="#FFD700" font-size="9" font-weight="bold" text-anchor="middle">★ 8.7</text>
          <text x="6" y="140" fill="#FFFFFF" font-size="11" font-weight="bold">Interstellar</text>
        </g>

        <!-- Poster 3 -->
        <g transform="translate(300, 0)">
          <rect x="0" y="0" width="136" height="150" rx="6" fill="url(#posterGrad1)" filter="url(#cardShadow)"/>
          <rect x="6" y="6" width="36" height="16" rx="3" fill="#000000" fill-opacity="0.75"/>
          <text x="24" y="18" fill="#FFD700" font-size="9" font-weight="bold" text-anchor="middle">★ 8.4</text>
          <text x="6" y="140" fill="#FFFFFF" font-size="11" font-weight="bold">Gladiator II</text>
        </g>

        <!-- Poster 4 -->
        <g transform="translate(450, 0)">
          <rect x="0" y="0" width="136" height="150" rx="6" fill="url(#posterGrad5)" filter="url(#cardShadow)"/>
          <rect x="6" y="6" width="36" height="16" rx="3" fill="#000000" fill-opacity="0.75"/>
          <text x="24" y="18" fill="#FFD700" font-size="9" font-weight="bold" text-anchor="middle">★ 8.1</text>
          <text x="6" y="140" fill="#FFFFFF" font-size="11" font-weight="bold">Alien: Romulus</text>
        </g>

        <!-- Poster 5 -->
        <g transform="translate(600, 0)">
          <rect x="0" y="0" width="136" height="150" rx="6" fill="url(#posterGrad4)" filter="url(#cardShadow)"/>
          <rect x="6" y="6" width="36" height="16" rx="3" fill="#000000" fill-opacity="0.75"/>
          <text x="24" y="18" fill="#FFD700" font-size="9" font-weight="bold" text-anchor="middle">★ 8.5</text>
          <text x="6" y="140" fill="#FFFFFF" font-size="11" font-weight="bold">The Batman</text>
        </g>

        <!-- Poster 6 -->
        <g transform="translate(750, 0)">
          <rect x="0" y="0" width="136" height="150" rx="6" fill="url(#posterGrad6)" filter="url(#cardShadow)"/>
          <rect x="6" y="6" width="36" height="16" rx="3" fill="#000000" fill-opacity="0.75"/>
          <text x="24" y="18" fill="#FFD700" font-size="9" font-weight="bold" text-anchor="middle">★ 8.0</text>
          <text x="6" y="140" fill="#FFFFFF" font-size="11" font-weight="bold">Twisters</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Left Navigation Drawer (Collapsed, Home selected) -->
  
    <g id="TvNavDrawer">
      <rect x="0" y="0" width="64" height="720" fill="#141414" fill-opacity="0.96" filter="url(#cardShadow)"/>
      <line x1="64" y1="0" x2="64" y2="720" stroke="#252525" stroke-width="1"/>
      
      <!-- Brand Logo -->
      <g transform="translate(14, 28)">
        <text x="0" y="20" fill="#E50914" font-size="20" font-weight="900" letter-spacing="1">IDLIX</text>
        
      </g>
    
        <g transform="translate(10, 86)">
          <rect x="0" y="0" width="44" height="42" rx="8" fill="#E50914" filter="url(#focusGlow)"/>
          <g transform="translate(11, 9)">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="#FFFFFF"/>
          </g>
          
        </g>
        
        <g transform="translate(10, 140)">
          <rect x="0" y="0" width="44" height="42" rx="8" fill="transparent" />
          <g transform="translate(11, 9)">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="#888888"/>
          </g>
          
        </g>
        
        <g transform="translate(10, 194)">
          <rect x="0" y="0" width="44" height="42" rx="8" fill="transparent" />
          <g transform="translate(11, 9)">
            <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z" fill="#888888"/>
          </g>
          
        </g>
        
        <g transform="translate(10, 248)">
          <rect x="0" y="0" width="44" height="42" rx="8" fill="transparent" />
          <g transform="translate(11, 9)">
            <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z" fill="#888888"/>
          </g>
          
        </g>
        
        <g transform="translate(10, 302)">
          <rect x="0" y="0" width="44" height="42" rx="8" fill="transparent" />
          <g transform="translate(11, 9)">
            <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z" fill="#888888"/>
          </g>
          
        </g>
        
        <g transform="translate(10, 356)">
          <rect x="0" y="0" width="44" height="42" rx="8" fill="transparent" />
          <g transform="translate(11, 9)">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="#888888"/>
