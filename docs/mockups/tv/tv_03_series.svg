<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#141414;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141414" stop-opacity="0.98"/>
      <stop offset="40%" stop-color="#141414" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#141414" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="heroBottomGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414" stop-opacity="0"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#b81d24"/>
    </linearGradient>
    <linearGradient id="posterGrad1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#451a03"/></linearGradient>
    <linearGradient id="posterGrad2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="posterGrad3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#581c87"/></linearGradient>
    <linearGradient id="posterGrad4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#064e3b"/></linearGradient>
    <linearGradient id="posterGrad5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#312e81"/></linearGradient>
    <linearGradient id="posterGrad6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e11d48"/><stop offset="100%" stop-color="#881337"/></linearGradient>
    <filter id="focusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    </defs>
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <g transform="translate(64, 0)">
    <g transform="translate(48, 28)">
      <text x="0" y="24" fill="#FFFFFF" font-size="24" font-weight="900">Serial TV / TV Series</text>
      <g transform="translate(260, 2)">
        <rect x="0" y="0" width="80" height="30" rx="15" fill="#E50914"/>
        <text x="40" y="20" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">Semua</text>
        <rect x="92" y="0" width="88" height="30" rx="15" fill="#262626"/>
        <text x="136" y="20" fill="#AAAAAA" font-size="12" text-anchor="middle">K-Drama</text>
        <rect x="192" y="0" width="76" height="30" rx="15" fill="#262626"/>
        <text x="230" y="20" fill="#AAAAAA" font-size="12" text-anchor="middle">Anime</text>
        <rect x="280" y="0" width="82" height="30" rx="15" fill="#262626"/>
        <text x="321" y="20" fill="#AAAAAA" font-size="12" text-anchor="middle">Ongoing</text>
        <rect x="374" y="0" width="76" height="30" rx="15" fill="#262626"/>
        <text x="412" y="20" fill="#AAAAAA" font-size="12" text-anchor="middle">Tamat</text>
      </g>
    </g>

    <!-- Featured Series Banner -->
    <g transform="translate(48, 80)">
      <rect x="0" y="0" width="1120" height="240" rx="10" fill="url(#posterGrad5)" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="1120" height="240" rx="10" fill="url(#heroGradient)"/>
      <g transform="translate(36, 36)">
        <rect x="0" y="0" width="70" height="20" rx="3" fill="#E50914"/>
        <text x="35" y="14" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">SEASON 2</text>
        <text x="0" y="60" fill="#FFFFFF" font-size="32" font-weight="900">HOUSE OF THE DRAGON</text>
        <text x="0" y="85" fill="#FFD700" font-size="13" font-weight="bold">★ 8.4  <tspan fill="#AAAAAA">| 2024 | 8 Episode | Aksi • Drama • Fantasi</tspan></text>
        <text x="0" y="115" fill="#DDDDDD" font-size="12">Perang saudara Targaryen (Dance of the Dragons) membara di antara kubu Hijau dan kubu Hitam.</text>
        <g transform="translate(0, 140)">
          <rect x="0" y="0" width="140" height="36" rx="6" fill="#E50914"/>
          <text x="70" y="23" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">▶ Lanjutkan S2:E1</text>
        </g>
      </g>
    </g>

    <!-- Swimlane: Serial Populer -->
    <g transform="translate(48, 345)">
      <text x="0" y="0" fill="#FFFFFF" font-size="16" font-weight="bold">Serial Populer Minggu Ini</text>
      <g transform="translate(0, 16)">
        <g><rect x="0" y="0" width="140" height="155" rx="6" fill="url(#posterGrad4)"/><text x="6" y="145" fill="#FFFFFF" font-size="11" font-weight="bold">The Boys (S4)</text></g>
        <g transform="translate(155,0)"><rect x="0" y="0" width="140" height="155" rx="6" fill="url(#posterGrad2)"/><text x="6" y="145" fill="#FFFFFF" font-size="11" font-weight="bold">Loki (S2)</text></g>
        <g transform="translate(310,0)"><rect x="0" y="0" width="140" height="155" rx="6" fill="url(#posterGrad1)"/><text x="6" y="145" fill="#FFFFFF" font-size="11" font-weight="bold">Fallout (S1)</text></g>
        <g transform="translate(465,0)"><rect x="0" y="0" width="140" height="155" rx="6" fill="url(#posterGrad6)"/><text x="6" y="145" fill="#FFFFFF" font-size="11" font-weight="bold">Stranger Things</text></g>
        <g transform="translate(620,0)"><rect x="0" y="0" width="140" height="155" rx="6" fill="url(#posterGrad3)"/><text x="6" y="145" fill="#FFFFFF" font-size="11" font-weight="bold">The Penguin</text></g>
        <g transform="translate(775,0)"><rect x="0" y="0" width="140" height="155" rx="6" fill="url(#posterGrad5)"/><text x="6" y="145" fill="#FFFFFF" font-size="11" font-weight="bold">Shōgun</text></g>
      </g>
    </g>

    <!-- Swimlane: K-Drama -->
    <g transform="translate(48, 540)">
      <text x="0" y="0" fill="#FFFFFF" font-size="16" font-weight="bold">Drama Korea Pilihan (K-Drama)</text>
      <g transform="translate(0, 14)">
        <g><rect x="0" y="0" width="140" height="140" rx="6" fill="url(#posterGrad6)"/><text x="6" y="130" fill="#FFFFFF" font-size="11" font-weight="bold">Queen of Tears</text></g>
        <g transform="translate(155,0)"><rect x="0" y="0" width="140" height="140" rx="6" fill="url(#posterGrad5)"/><text x="6" y="130" fill="#FFFFFF" font-size="11" font-weight="bold">Lovely Runner</text></g>
        <g transform="translate(310,0)"><rect x="0" y="0" width="140" height="140" rx="6" fill="url(#posterGrad3)"/><text x="6" y="130" fill="#FFFFFF" font-size="11" font-weight="bold">Squid Game (S2)</text></g>
        <g transform="translate(465,0)"><rect x="0" y="0" width="140" height="140" rx="6" fill="url(#posterGrad1)"/><text x="6" y="130" fill="#FFFFFF" font-size="11" font-weight="bold">Marry My Husband</text></g>
        <g transform="translate(620,0)"><rect x="0" y="0" width="140" height="140" rx="6" fill="url(#posterGrad2)"/><text x="6" y="130" fill="#FFFFFF" font-size="11" font-weight="bold">Moving</text></g>
        <g transform="translate(775,0)"><rect x="0" y="0" width="140" height="140" rx="6" fill="url(#posterGrad4)"/><text x="6" y="130" fill="#FFFFFF" font-size="11" font-weight="bold">A Killer Paradox</text></g>
      </g>
    </g>
  </g>

  <!-- Left Drawer: Serial TV selected - index 4 -->
  
    <g id="TvNavDrawer">
      <rect x="0" y="0" width="64" height="720" fill="#141414" fill-opacity="0.96" filter="url(#cardShadow)"/>
      <line x1="64" y1="0" x2="64" y2="720" stroke="#252525" stroke-width="1"/>
      
      <!-- Brand Logo -->
