            <text x="80" y="24" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Tes Kuota SubDL</text>

            <rect x="175" y="0" width="140" height="38" rx="6" fill="#282828" stroke="#444444"/>
            <text x="245" y="24" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Daftar API Key</text>
          </g>
        </g>
      </g>

      <!-- Section 3: Subtitle Appearance & Style -->
      <g transform="translate(0, 280)">
        <rect x="0" y="0" width="540" height="260" rx="10" fill="#1E1E1E" stroke="#333333" filter="url(#cardShadow)"/>
        <text x="24" y="36" fill="#FFFFFF" font-size="17" font-weight="bold">3. Tampilan &amp; Posisi Subtitle</text>
        
        <!-- Color Choice -->
        <g transform="translate(24, 60)">
          <text x="0" y="14" fill="#AAAAAA" font-size="12">Warna Subtitle:</text>
          <g transform="translate(0, 24)">
            <rect x="0" y="0" width="90" height="32" rx="6" fill="#333333" stroke="#FFD700" stroke-width="2"/>
            <circle cx="20" cy="16" r="6" fill="#FFD700"/>
            <text x="34" y="20" fill="#FFD700" font-size="12" font-weight="bold">Kuning</text>

            <g transform="translate(100, 0)">
              <rect x="0" y="0" width="90" height="32" rx="6" fill="#222222"/>
              <circle cx="20" cy="16" r="6" fill="#FFFFFF"/>
              <text x="34" y="20" fill="#FFFFFF" font-size="12">Putih</text>
            </g>

            <g transform="translate(200, 0)">
              <rect x="0" y="0" width="90" height="32" rx="6" fill="#222222"/>
              <circle cx="20" cy="16" r="6" fill="#4ade80"/>
              <text x="34" y="20" fill="#4ade80" font-size="12">Hijau</text>
            </g>
          </g>
        </g>

        <!-- Position & Size -->
        <g transform="translate(24, 150)">
          <text x="0" y="14" fill="#AAAAAA" font-size="12">Ukuran &amp; Posisi Vertikal Subtitle:</text>
          <g transform="translate(0, 24)">
            <rect x="0" y="0" width="220" height="38" rx="6" fill="#282828" stroke="#444444"/>
            <text x="110" y="24" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Ukuran: Sedang (24sp)</text>

            <rect x="235" y="0" width="220" height="38" rx="6" fill="#282828" stroke="#444444"/>
            <text x="345" y="24" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Buka Visual Editor</text>
          </g>
        </g>
      </g>

      <!-- Section 4: App Update & About -->
      <g transform="translate(565, 280)">
        <rect x="0" y="0" width="540" height="260" rx="10" fill="#1E1E1E" stroke="#333333" filter="url(#cardShadow)"/>
        <text x="24" y="36" fill="#FFFFFF" font-size="17" font-weight="bold">4. Tentang Aplikasi &amp; Pembaruan</text>
        
        <g transform="translate(24, 70)">
          <text x="0" y="20" fill="#E50914" font-size="22" font-weight="900">IDLIX for Android TV</text>
          <text x="0" y="44" fill="#AAAAAA" font-size="13">Versi Rilis: v1.0.3 (Build Code 4)</text>
          <text x="0" y="66" fill="#777777" font-size="12">Leanback UI • Media3 ExoPlayer Native • SubDL Integrated</text>
          
          <g transform="translate(0, 95)">
            <rect x="0" y="0" width="200" height="40" rx="6" fill="#E50914"/>
            <text x="100" y="25" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Periksa Pembaruan APK</text>
            <text x="220" y="25" fill="#22c55e" font-size="12" font-weight="bold">✓ Versi Terbaru</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Left Drawer: Pengaturan selected - index 5 -->
  
