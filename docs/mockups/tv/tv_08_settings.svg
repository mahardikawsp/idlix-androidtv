<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#141414;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141414" stop-opacity="0.98"/>
      <stop offset="40%" stop-color="#141414" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#141414" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="heroBottomGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414" stop-opacity="0"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#b81d24"/>
    </linearGradient>
    <linearGradient id="posterGrad1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#451a03"/></linearGradient>
    <linearGradient id="posterGrad2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="posterGrad3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#581c87"/></linearGradient>
    <linearGradient id="posterGrad4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#064e3b"/></linearGradient>
    <linearGradient id="posterGrad5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#312e81"/></linearGradient>
    <linearGradient id="posterGrad6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e11d48"/><stop offset="100%" stop-color="#881337"/></linearGradient>
    <filter id="focusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    </defs>
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <g transform="translate(64, 0)">
    <g transform="translate(48, 36)">
      <text x="0" y="24" fill="#FFFFFF" font-size="26" font-weight="900">Pengaturan Sistem &amp; Subtitle</text>
      <text x="0" y="48" fill="#888888" font-size="13">Konfigurasi alamat Backend API, SubDL Subtitle, dan gaya tampilan di Android TV</text>
    </g>

    <!-- Settings Content Cards Grid -->
    <g transform="translate(48, 100)">
      
      <!-- Section 1: Backend API Configuration (FOCUSED) -->
      <g filter="url(#focusGlow)">
        <rect x="0" y="0" width="540" height="260" rx="10" fill="#1E1E1E" stroke="#E50914" stroke-width="2"/>
        <text x="24" y="36" fill="#FFFFFF" font-size="17" font-weight="bold">1. Alamat Backend API (Scraper Proxy)</text>
        <text x="24" y="58" fill="#AAAAAA" font-size="12">Endpoint server Fastify untuk bypass Cloudflare &amp; resolver HLS</text>

        <!-- Input Box -->
        <g transform="translate(24, 80)">
          <rect x="0" y="0" width="492" height="44" rx="6" fill="#121212" stroke="#444444"/>
          <text x="14" y="28" fill="#22c55e" font-size="14" font-weight="bold">https://halakios.com/idix-api/</text>
        </g>

        <!-- Status & Buttons -->
        <g transform="translate(24, 140)">
          <rect x="0" y="0" width="160" height="26" rx="13" fill="#052e16" stroke="#22c55e"/>
          <text x="80" y="17" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="middle">🟢 STATUS: TERHUBUNG</text>
          
          <g transform="translate(0, 48)">
            <!-- Focus button -->
            <rect x="0" y="0" width="150" height="38" rx="6" fill="#E50914"/>
            <text x="75" y="24" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Uji Koneksi API</text>

            <rect x="165" y="0" width="130" height="38" rx="6" fill="#282828" stroke="#444444"/>
            <text x="230" y="24" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Simpan URL</text>
          </g>
        </g>
      </g>

      <!-- Section 2: SubDL Subtitle Integration -->
      <g transform="translate(565, 0)">
        <rect x="0" y="0" width="540" height="260" rx="10" fill="#1E1E1E" stroke="#333333" filter="url(#cardShadow)"/>
        <text x="24" y="36" fill="#FFFFFF" font-size="17" font-weight="bold">2. Integrasi Subtitle SubDL.com</text>
        <text x="24" y="58" fill="#AAAAAA" font-size="12">API Key untuk unduh otomatis ribuan subtitle Bahasa Indonesia</text>

        <g transform="translate(24, 80)">
          <rect x="0" y="0" width="492" height="44" rx="6" fill="#121212" stroke="#333333"/>
          <text x="14" y="28" fill="#888888" font-size="14">sk_subdl_live_••••••••••••••••••••••••</text>
        </g>

        <g transform="translate(24, 140)">
          <rect x="0" y="0" width="140" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1"/>
          <text x="70" y="17" fill="#818cf8" font-size="11" font-weight="bold" text-anchor="middle">🔑 API KEY VALID</text>
          
