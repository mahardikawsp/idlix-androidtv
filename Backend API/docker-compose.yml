version: '3.8'

services:
  idlix-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idlix-backend-api
    restart: unless-stopped
    # Gunakan network host agar container bisa mengakses SOCKS5 proxy 127.0.0.1:40000 di VPS
    network_mode: "host"
    environment:
      - PORT=5376
      - HOST=0.0.0.0
      - IDLIX_BASE_URL=https://z2.idlixku.com
      - LOG_LEVEL=info
      - PROXY_SERVER=socks5://127.0.0.1:40000
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    shm_size: '256mb'
